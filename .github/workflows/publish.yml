name: Publish to npm

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"        # v1.2.3
      - "v[0-9]+.[0-9]+.[0-9]+-*"       # v1.2.3-beta.1

permissions:
  contents: write   # needed to create GitHub Releases
  id-token: write   # needed for npm Trusted Publishing (OIDC) — no NPM_TOKEN required

jobs:
  # ── 1. CI — test + typecheck en la misma ejecución ───────────────────────────
  ci:
    name: Test & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  # ── 2. Build + publish ────────────────────────────────────────────────────────
  publish:
    name: Build & publish
    needs: ci
    runs-on: ubuntu-latest
    environment: npm-publish   # optional: require manual approval in GitHub UI
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # npm@latest (12.x) requires Node >=22.22.2 — bumped from 20
          # after a real CI failure (EBADENGINE). This is independent
          # from the test job's Node matrix (18/20/22), which still
          # verifies the published package itself works on all of those.
          node-version: "22"
          cache: "npm"
          # Deliberately NOT setting registry-url here: setup-node
          # auto-generates a .npmrc expecting NODE_AUTH_TOKEN whenever
          # registry-url is set, even with no token provided. That
          # residual token-auth config was interfering with pure OIDC
          # Trusted Publishing (npm kept attempting token auth with an
          # effectively empty token, failing with a 404, instead of
          # using the GitHub OIDC identity). npm publish resolves the
          # registry from package.json/npmrc defaults on its own.

      - name: Install dependencies
        run: npm ci

      # Trusted Publishing (OIDC) requires npm 11.5.1+ — setup-node's
      # bundled npm may be older, so force an update before publishing.
      - name: Update npm for OIDC support
        run: npm install -g npm@latest

      # Extract version from tag (v1.2.3 → 1.2.3)
      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Ensure package.json version matches the tag
      - name: Validate version matches tag
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${{ steps.version.outputs.VERSION }}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "❌ package.json version ($PKG_VERSION) does not match tag ($TAG_VERSION)"
            echo "   Update package.json before tagging."
            exit 1
          fi
          echo "✅ Version $PKG_VERSION matches tag"

      - name: Build
        run: npm run build

      # Detect if tag is a prerelease (v1.2.3-beta.1 → tag=beta)
      - name: Detect dist-tag
        id: dist_tag
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          if echo "$VERSION" | grep -qE '\-'; then
            # e.g. 1.2.3-beta.1 → "beta", 1.2.3-rc.0 → "rc"
            DIST_TAG=$(echo "$VERSION" | sed 's/[0-9]*\.[0-9]*\.[0-9]*-//' | cut -d. -f1)
          else
            DIST_TAG="latest"
          fi
          echo "DIST_TAG=$DIST_TAG" >> "$GITHUB_OUTPUT"
          echo "Publishing with dist-tag: $DIST_TAG"

      # Trusted Publishing (OIDC) — no NPM_TOKEN needed. npm matches this
      # workflow run (org/repo/workflow filename/environment) against the
      # Trusted Publisher configured on npmjs.com for this package, and
      # automatically generates provenance attestations (no --provenance
      # flag needed — adding it is redundant with OIDC auth).
      - name: Publish to npm
        run: npm publish --access public --tag ${{ steps.dist_tag.outputs.DIST_TAG }}

      # Create GitHub Release with auto-generated notes
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "@privaro/sdk ${{ github.ref_name }}"
          generate_release_notes: true
          draft: false
          prerelease: ${{ steps.dist_tag.outputs.DIST_TAG != 'latest' }}
