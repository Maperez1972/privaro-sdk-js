name: Publish to npm

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"        # v1.2.3
      - "v[0-9]+.[0-9]+.[0-9]+-*"       # v1.2.3-beta.1

permissions:
  contents: read
  id-token: write   # needed for npm provenance

jobs:
  # ── 1. CI — test + typecheck en la misma ejecución ───────────────────────────
  ci:
    name: Test & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  # ── 2. Build + publish ────────────────────────────────────────────────────────
  publish:
    name: Build & publish
    needs: ci
    runs-on: ubuntu-latest
    environment: npm-publish   # optional: require manual approval in GitHub UI
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      # Extract version from tag (v1.2.3 → 1.2.3)
      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Ensure package.json version matches the tag
      - name: Validate version matches tag
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${{ steps.version.outputs.VERSION }}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "❌ package.json version ($PKG_VERSION) does not match tag ($TAG_VERSION)"
            echo "   Update package.json before tagging."
            exit 1
          fi
          echo "✅ Version $PKG_VERSION matches tag"

      - name: Build
        run: npm run build

      # Detect if tag is a prerelease (v1.2.3-beta.1 → tag=beta)
      - name: Detect dist-tag
        id: dist_tag
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          if echo "$VERSION" | grep -qE '\-'; then
            # e.g. 1.2.3-beta.1 → "beta", 1.2.3-rc.0 → "rc"
            DIST_TAG=$(echo "$VERSION" | sed 's/[0-9]*\.[0-9]*\.[0-9]*-//' | cut -d. -f1)
          else
            DIST_TAG="latest"
          fi
          echo "DIST_TAG=$DIST_TAG" >> "$GITHUB_OUTPUT"
          echo "Publishing with dist-tag: $DIST_TAG"

      - name: Publish to npm
        run: npm publish --access public --tag ${{ steps.dist_tag.outputs.DIST_TAG }} --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Create GitHub Release with auto-generated notes
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "@privaro/sdk ${{ github.ref_name }}"
          generate_release_notes: true
          draft: false
          prerelease: ${{ steps.dist_tag.outputs.DIST_TAG != 'latest' }}
