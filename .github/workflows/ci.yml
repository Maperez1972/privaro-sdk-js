name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".github/workflows/publish.yml"
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Test & typecheck (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["18", "20", "22"]   # test across supported Node versions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build (smoke test)
        run: npm run build
